<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIMTRICK - Kích hoạt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="appContainer">
        <div class="logo">
            <svg viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M16 28 L22 22 L28 28 L34 22" stroke="currentColor" stroke-width="2.5" fill="none"/>
                <circle cx="24" cy="16" r="2" fill="#f5c842"/>
                <path d="M12 32 L18 26 L24 32 L30 26 L36 32" stroke="currentColor" stroke-width="1.8" fill="none" opacity="0.6"/>
            </svg>
        </div>

        <h1>AIMTRICK</h1>
        <div class="sub">KÍCH HOẠT BẢN QUYỀN <span class="badge">v3.2.4</span></div>

        <div class="key-box">
            <input type="text" id="licenseKey" placeholder="Nhập mã kích hoạt" autocomplete="off" spellcheck="false">
            <button id="activateBtn">KÍCH HOẠT</button>
        </div>

        <div id="statusMessage" class="status info">
            <span>◆</span> Nhập key để kích hoạt
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">Loại key</div>
                <div class="value" id="keyType">---</div>
            </div>
            <div class="info-item">
                <div class="label">Thiết bị</div>
                <div class="value" id="deviceLimit">---</div>
            </div>
            <div class="info-item">
                <div class="label">Hạn dùng</div>
                <div class="value" id="expiryInfo">---</div>
            </div>
        </div>

        <div class="footer">
            <span>VTĐZAI</span> • Bảo hành dài hạn • Hỗ trợ 24/7
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="index.js"></script>
</body>
</html>
